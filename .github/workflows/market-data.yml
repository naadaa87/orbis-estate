# 상권 데이터 자동 갱신
# 매주 화요일 아침(한국 시간 06:17)에 서울시 상권분석서비스·한국부동산원 임대동향의 새 분기가
# 공개됐는지 확인하고, 새 분기가 있을 때만 data/ 폴더를 다시 만들어 저장합니다.
# 저장되면 Cloudflare Pages가 자동으로 다시 배포합니다.
#
# 필요한 비밀값 (저장소 → Settings → Secrets and variables → Actions → New repository secret)
#   SEOUL_API_KEY : 서울 열린데이터광장 인증키 (필수)
#   REB_API_KEY   : 한국부동산원 R-ONE 오픈API 인증키 (선택)
#
# 바로 실행하려면: 저장소 → Actions → "상권 데이터 갱신" → Run workflow
name: 상권 데이터 갱신

on:
  workflow_dispatch:
    inputs:
      force:
        description: "같은 분기라도 다시 만들기 (1 = 예)"
        required: false
        default: "0"
  schedule:
    - cron: "17 21 * * 1"

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 상권 데이터 만들기
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
          FORCE: ${{ github.event.inputs.force }}
        run: node scripts/market-data/build.mjs

      - name: 바뀐 데이터 저장
        run: |
          git config user.name "orbis-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data ]; then git add data; fi
          if git diff --cached --quiet; then
            echo "새로 저장할 데이터가 없습니다."
            exit 0
          fi
          git commit -m "상권 데이터 갱신 ($(date -u +%Y-%m-%d))"
          git push
