<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>오르비스 관리자</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--navy:#14243E;--navy2:#1D3152;--gold:#C5A15A;--gold-t:#866829;--gold-soft:#F6EFE2;--ink:#1F2733;--slate:#5B6576;--slate2:#7A8494;--line:#E3E6EB;--line2:#EEF0F3;--bg:#F6F7F9;--card:#fff;--ok:#2F6F4F;--ok-soft:#E7F2EC;--warn:#8A5A12;--warn-soft:#FBF3E2;--bad:#A23A2A;--bad-soft:#FBECE8;--r:12px;--sans:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.6;word-break:keep-all}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}
.hide{display:none!important}
/* 로그인 */
.login{min-height:100%;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px 30px;box-shadow:0 18px 40px rgba(20,36,62,.08)}
.login-card img{width:44px;height:auto}
.login-card h1{font-size:21px;margin-top:14px;color:var(--navy)}
.login-card p{color:var(--slate);font-size:13.5px;margin-top:4px}
.login-card form{margin-top:22px;display:grid;gap:12px}
/* 공통 입력 */
.f{display:grid;gap:6px}
.f label,.f .lb{font-size:13px;font-weight:700;color:var(--navy)}
.f .hint{font-size:12px;color:var(--slate2)}
.f .cnt{font-size:12px;color:var(--slate2);justify-self:end;margin-top:-2px}
.f .cnt.bad{color:var(--bad)}
input[type=text],input[type=password],input[type=url],input[type=email],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;border:1.5px solid #D9DEE6;border-radius:10px;padding:10px 12px;background:#fff;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(197,161,90,.15)}
textarea{resize:vertical;line-height:1.7}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid transparent;border-radius:10px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn-gold{background:var(--gold);color:#1C1507}
.btn-gold:hover{background:#B9964F}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy2)}
.btn-line{background:#fff;border-color:#D3D8E0;color:var(--navy)}
.btn-line:hover{border-color:var(--navy)}
.btn-bad{background:#fff;border-color:#E9C7BF;color:var(--bad)}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:default}
.err{color:var(--bad);font-size:13px;min-height:18px}
/* 셸 */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand img{width:30px}
.brand b{display:block;font-size:15px;color:var(--navy)}
.brand span{display:block;font-size:11.5px;color:var(--slate2)}
.side a.nv{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--slate);font-weight:600}
.side a.nv:hover{background:var(--bg);color:var(--navy)}
.side a.nv.on{background:var(--navy);color:#fff}
.side a.nv svg{width:17px;height:17px;flex:none}
.side .sp{flex:1}
.side .sm-link{font-size:12.5px;color:var(--slate2);padding:6px 12px}
.side .sm-link:hover{color:var(--navy)}
.main{padding:26px 32px 60px;min-width:0}
.topline{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.topline h2{font-size:22px;color:var(--navy)}
.topline p{color:var(--slate);font-size:13.5px;margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.card h3{font-size:15px;color:var(--navy);margin-bottom:12px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi b{display:block;font-size:28px;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:13px;color:var(--slate)}
.kpi.gold{border-color:#E8DCBE;background:var(--gold-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.sch{background:#E8EEF8;color:#2B4C86}
.pill.draft{background:#EEF0F3;color:var(--slate)}
.pill.hid{background:#F1E9E7;color:#7C4A40}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.run{background:#E8EEF8;color:#2B4C86}
.list{display:grid;gap:0}
.list .row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.list .row:last-child{border-bottom:0}
.list .row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .row time{color:var(--slate2);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.links a{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600;color:var(--navy);background:#fff}
.links a:hover{border-color:var(--gold)}
.links a span{display:block;font-size:12px;font-weight:500;color:var(--slate2)}
/* 표 */
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:#FAFBFC;text-align:left;font-size:12.5px;color:var(--slate);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
td .ttl{font-weight:700;color:var(--navy)}
td .sub{font-size:12px;color:var(--slate2)}
td.nowrap{white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700;color:var(--slate);cursor:pointer}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.toolrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.toolrow input[type=search]{max-width:260px}
/* 편집기 */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.ed-side{position:sticky;top:18px;display:grid;gap:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
.tb{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border:1.5px solid #D9DEE6;border-bottom:0;border-radius:10px 10px 0 0;background:#FAFBFC}
.tb button{border:0;background:none;border-radius:6px;padding:5px 9px;font-size:12.5px;font-weight:700;color:var(--slate);cursor:pointer}
.tb button:hover{background:#fff;color:var(--navy)}
#body{border-radius:0 0 10px 10px;min-height:520px;font-size:14.5px}
.rep{display:grid;gap:10px}
.rep .it{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px;background:#FCFCFD}
.rep .it .inner{display:grid;gap:6px}
.lint li{font-size:13px;padding:4px 0 4px 18px;position:relative;list-style:none}
.lint li:before{content:"";position:absolute;left:3px;top:11px;width:7px;height:7px;border-radius:50%}
.lint li.e:before{background:var(--bad)}
.lint li.w:before{background:var(--gold)}
.lint li.o:before{background:var(--ok)}
.pv-frame{width:100%;height:76vh;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.mode{display:flex;gap:6px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:50;max-width:min(560px,calc(100% - 32px));box-shadow:0 12px 30px rgba(20,36,62,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--bad)}
.note{background:var(--gold-soft);border:1px solid #E8DCBE;border-radius:10px;padding:12px 14px;font-size:13px;color:#6E5520}
.note.cool{background:#F3F5F8;border-color:var(--line);color:var(--slate)}
.help h4{font-size:14.5px;color:var(--navy);margin:18px 0 6px}
.help p,.help li{font-size:13.5px;color:#3A4353}
.help ol,.help ul{padding-left:20px}
.empty{padding:30px;text-align:center;color:var(--slate2)}
.mbar{display:none}
@media(max-width:1100px){.ed{grid-template-columns:1fr}.ed-side{position:static}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){.shell{grid-template-columns:minmax(0,1fr)}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px;gap:4px;border-right:0;border-bottom:1px solid var(--line)}.brand{width:100%;padding-bottom:8px}.side .sp,.side .sm-link{display:none}.side a.nv{padding:7px 10px;font-size:13px}.side a.nv svg{display:none}.main{padding:20px 16px 60px}.g2,.fgrid,.links{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><div class="login"><div class="login-card"><p>불러오는 중…</p></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:30px">관리자 화면은 자바스크립트가 필요합니다.</p></noscript>
<script type="module" src="/admin/admin.js?v=20261026"></script>
</body>
</html>
